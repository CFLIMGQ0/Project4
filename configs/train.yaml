# 基础参数
gpu_ids: [0, 1, 2]  # 使用的GPU编号
num_workers: 8  # DataLoader进程数
seed: 42  # 随机种子
image_size: 224  # 输入图像尺寸
max_epochs: 30  # 最大训练轮数
patience: 30  # 早停轮数

# 数据参数
max_exams_per_task: 0  # 每个任务的样本数量上限，0 表示使用全量数据
min_instances: 1  # 每个bag最少图像数
split_ratio: [0.6, 0.2, 0.2]  # train/val/test比例
train_sampling_strategy: random  # 训练采样
eval_sampling_strategy: uniform  # 验证测试采样
task_selection_dir_name: task_data  # 任务CSV目录
train_run_dir_name: train_runs  # 训练输出根目录
run_dir_prefix: run  # 训练运行前缀

# 运行模型
enabled_models:
  - gastro_label_graph_mil  # 启用的模型列表
  # - gastro_baseline  # 启用的模型列表
  # - colonoscopy_baseline  # 启用的模型列表

# 默认训练参数
batch_size: 12  # 训练batch size
eval_batch_size: 12  # 验证测试batch size
train_max_instances: 16  # 训练每个bag最多实例数
eval_max_instances: 16  # 验证测试每个bag最多实例数
train_max_batch_instances: 192  # 训练每个batch最多实例数
eval_max_batch_instances: 192  # 验证测试每个batch最多实例数
pin_memory: true  # 固定页内存，加快CPU到GPU拷贝
persistent_workers: true  # worker常驻，避免每个epoch反复拉起
loader_prefetch_factor: 2  # DataLoader预取系数
image_cache_mode: disk  # 图片缓存模式
image_cache_dir: /home/Lim/Project4/datasets/task_data  # 图片缓存根目录
image_cache_warmup: true  # 图片缓存预热开关
memory_cache_size: 0  # 内存缓存容量
random_instance_dropout: 0.25  # 训练实例丢弃比例
optimizer_name: adamw  # 优化器类型
lr: 0.00002  # 学习率
weight_decay: 0.02  # 权重衰减
warmup_ratio: 0.2  # 预热比例
grad_accum_steps: 1  # 梯度累积步数
amp: true  # 是否开启混合精度
topk_evidence: 5  # 保存证据图数量
loss_name: asymmetric  # 损失函数
monitor_metric: val_loss  # 主监控指标
monitor_mode: min  # 主监控指标方向

# 自动探索开关
auto_explore: false

# 自动 Baselines 开关
auto_baselines: false

# 自动 SOTAs 开关
auto_sotas: false

# 自动消融实验开关
# 可选：false / all / bag_size_ablation / attn_dim_ablation
auto_ablations: all
