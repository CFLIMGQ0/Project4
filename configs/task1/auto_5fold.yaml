# TASK1 表2/表3/表4 五折交叉验证实验

output_dir_name: exp_task1_5fold
folds: 5
seed: 20260526
selection_alias: best_macro_f1
run_test: true
skip_completed: true
force_rerun: false
inherit_run_from_source: true
force_rebuild_records_cache: false
image_cache_warmup: false

metrics:
  overall:
    - macro_recall
    - macro_precision
    - macro_f1
    - macro_roc_auc
    - macro_pr_auc
    - subset_accuracy
    - hamming_loss
    - kappa
  label_wise:
    - recall
    - precision
    - f1
    - roc_auc
    - pr_auc

