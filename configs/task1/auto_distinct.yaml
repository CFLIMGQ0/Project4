# TASK1 表2/表3/表4 统计显著性与置信区间实验

output_dir_name: exp_task1_distinct
selection_alias: best_macro_f1
bootstrap_samples: 2000
seed: 20260526
threshold: 0.5
cache_predictions: true
force_recompute_predictions: false

metrics:
  overall:
    - macro_recall
    - macro_precision
    - macro_f1
    - micro_f1
    - macro_roc_auc
    - macro_pr_auc
    - subset_accuracy
    - hamming_loss
    - kappa
  label_wise:
    - recall
    - precision
    - f1
    - roc_auc
    - pr_auc

