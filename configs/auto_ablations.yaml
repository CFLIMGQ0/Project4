goal: 固定 train.yaml 的训练超参数，自动运行胃镜模型的参数消融实验

# 消融实验总输出根目录
output_root_dir_name: gastro_ablations

# 每个消融实验训练结束后立即运行测试
run_test: true

# 结果排序依据
selection_alias: best_macro_f1
result_source: test_results

# 训练稳定性评价阈值
stability_filter:
  enabled: true
  min_epochs_trained: 10
  max_final_gap: 0.05
  max_val_loss_rebound_ratio: 0.25

remark:
  focus: 汇总胃镜标签图 MIL 不同参数设置下的测试结果与稳定性表现
  include_model_evaluations: true
  include_stability_filter: true

experiments:
  - name: bag_size_ablation
    enabled: true
    display_name: Bag 数量消融

  - name: attn_dim_ablation
    enabled: true
    display_name: 注意力维度消融
